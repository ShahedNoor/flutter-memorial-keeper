name: memorialkeeper
description: Preserve family tree, resting places, photos &amp; Dua for departed loved ones.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^17.1.0

  # Networking
  internet_connection_checker_plus: ^2.9.1+2
  dio: ^5.9.2

  # State Management
  fpdart: ^1.2.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1

  # Backend – Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.8

  # Backend – Supabase

  # Backend – Appwrite

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Images & SVG
  cached_network_image: ^3.4.1

  # Icons
  hugeicons: ^1.1.5

  # Shimmer / Skeleton
  skeletonizer: ^2.1.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Logging
  logger: ^2.6.2

  # Media
  image_picker: ^1.2.1

  # Utilities
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1

  # Device & System
  device_info_plus: ^11.2.0
  app_version_update: ^6.2.0


  # Localization
  easy_localization: ^3.0.8

  flutter_native_splash: ^2.4.7
  sqflite: ^2.4.4
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  share_plus: ^12.0.2
  google_sign_in: 7.2.0

  # Encryption & Crypto
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Code Generation

dependency_overrides:

flutter:
  uses-material-design: true

  assets:
    - assets/
    # - assets/images/
    - assets/icons/
    - assets/translations/
    - .env

